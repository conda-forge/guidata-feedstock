schema_version: 1

context:
  name: guidata
  version: "3.15.1"

package:
  name: guidata
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: b0f17cc67dd9e58864e41993ffc12d960f4b20f60a699f3db2ebec4d2a97904f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv
  python:
    entry_points:
      - gtrans = guidata.utils.translations:main
      - greqs = guidata.utils.genreqs:main
      - gbuild = guidata.utils.securebuild:main
      - gclean = guidata.utils.cleanup:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - h5py >=3.6
    - numpy >=1.22
    - qtpy >=1.9
    - requests
    - tomli

tests:
  - python:
      imports:
        - guidata
      python_version:
        - ${{ python_min }}.*
        - 3.*
      pip_check: true
  - script:
      - QT_QPA_PLATFORM=offscreen pytest --collect-only --pyargs guidata.tests
    requirements:
      run:
        - pytest
        - pyqt

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Automatic GUI generation for easy dataset editing and display with Python
  description: The guidata package is a Python library generating Qt graphical user interfaces. It is part of the PlotPyStack project, aiming at providing a unified framework for creating scientific GUIs with Python and Qt.
  homepage: https://github.com/PlotPyStack/guidata
  repository: https://github.com/PlotPyStack/guidata
  documentation: https://guidata.readthedocs.io

extra:
  recipe-maintainers:
    - PierreRaybaut
    - marcelotrevisani
    - beenje
